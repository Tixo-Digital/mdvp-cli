name: MDVP Design Quality Check
description: >
  Audit a URL for design quality — CSS health, visual quality, and structure
  scores — using the local exact rendered browser engine. No API key required.
  Fails the workflow if scores fall below configured thresholds.

author: Tixo Digital

branding:
  icon: eye
  color: gray-dark

inputs:
  url:
    description: URL to audit (e.g. https://preview.myapp.com)
    required: true

  working_directory:
    description: 'Directory to look for .mdvprc threshold config (default: repo root)'
    required: false
    default: '${{ github.workspace }}'

  fail_on_violation:
    description: Exit 1 if any threshold is violated (default true)
    required: false
    default: 'true'
  comment_on_pr:
    description: Post or update a pull request comment with the audit summary (default false)
    required: false
    default: 'false'

  # Inline threshold overrides (override .mdvprc if provided)
  max_colors:
    description: Max unique CSS colors (default 30)
    required: false
  max_font_families:
    description: Max unique font families (default 3)
    required: false
  max_font_sizes:
    description: Max unique font sizes (default 8)
    required: false
  min_spacing_grid_pct:
    description: Min % of spacing values on 4px grid (default 60)
    required: false
  min_css_health:
    description: Min css_health component score 0–100 (default 60)
    required: false
  min_overall:
    description: Min overall design score 0–100 (default 40)
    required: false

outputs:
  overall_score:
    description: Overall design score (0–100)
    value: ${{ steps.audit.outputs.overall_score }}
  grade:
    description: Letter grade (A+, A, B+, etc.)
    value: ${{ steps.audit.outputs.grade }}
  css_health_score:
    description: CSS health component score
    value: ${{ steps.audit.outputs.css_health_score }}
  violations:
    description: JSON array of threshold violations (empty array if pass)
    value: ${{ steps.audit.outputs.violations }}
  report_json:
    description: Full JSON audit report
    value: ${{ steps.audit.outputs.report_json }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Write threshold config (inline overrides)
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        node -e "
          const existing = (() => { try { return JSON.parse(require('fs').readFileSync('.mdvprc','utf-8')); } catch { return {}; } })();
          const t = existing.thresholds ?? existing ?? {};
          const overrides = {
            ${{ inputs.max_colors != '' && format('max_colors: {0},', inputs.max_colors) || '' }}
            ${{ inputs.max_font_families != '' && format('max_font_families: {0},', inputs.max_font_families) || '' }}
            ${{ inputs.max_font_sizes != '' && format('max_font_sizes: {0},', inputs.max_font_sizes) || '' }}
            ${{ inputs.min_spacing_grid_pct != '' && format('min_spacing_grid_pct: {0},', inputs.min_spacing_grid_pct) || '' }}
            ${{ inputs.min_css_health != '' && format('min_css_health: {0},', inputs.min_css_health) || '' }}
            ${{ inputs.min_overall != '' && format('min_overall: {0},', inputs.min_overall) || '' }}
          };
          const merged = { thresholds: { ...t, ...Object.fromEntries(Object.entries(overrides).filter(([,v]) => v !== undefined)) } };
          require('fs').writeFileSync('.mdvprc', JSON.stringify(merged, null, 2));
        " 2>/dev/null || true

    - name: Run MDVP audit
      id: audit
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -e
        RESULT=$(npx --yes @mdvp/cli@latest audit "${{ inputs.url }}" --exact --check --json 2>/tmp/mdvp-stderr.txt || true)
        EXIT_CODE=$?

        echo "overall_score=$(echo $RESULT | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); process.stdout.write(String(d.overall_score??''))")" >> $GITHUB_OUTPUT
        echo "grade=$(echo $RESULT | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); process.stdout.write(d.grade??'')")" >> $GITHUB_OUTPUT
        echo "css_health_score=$(echo $RESULT | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); process.stdout.write(String(d.components?.css_health?.score??''))")" >> $GITHUB_OUTPUT
        echo "violations=$(echo $RESULT | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); process.stdout.write(JSON.stringify(d.violations??[]))")" >> $GITHUB_OUTPUT

        # Write report to a temp file for the output (multiline safe)
        echo "$RESULT" > /tmp/mdvp-report.json
        echo "report_json<<EOF" >> $GITHUB_OUTPUT
        cat /tmp/mdvp-report.json >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        # Print summary to workflow log
        echo "::group::MDVP Design Quality Report"
        cat /tmp/mdvp-report.json | node -e "
          const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8'));
          console.log('Overall: ' + d.overall_score + '/100 (' + d.grade + ')');
          if (d.components) {
            const c = d.components;
            console.log('  css_health:     ' + c.css_health?.score + '  (' + c.css_health?.unique_colors + ' colors, ' + c.css_health?.unique_font_families + ' fonts, ' + c.css_health?.spacing_on_grid_pct + '% on grid)');
            console.log('  visual_quality: ' + c.visual_quality?.score);
            console.log('  structure:      ' + c.structure?.score);
            console.log('  originality:    ' + c.originality?.score);
          }
          if (d.violations?.length) {
            console.log('\nThreshold violations:');
            d.violations.forEach(v => console.log('  ✗ ' + v.msg));
          } else if (d.violations) {
            console.log('\n✓ All thresholds pass');
          }
          if (d.recommendations?.length) {
            console.log('\nRecommendations:');
            d.recommendations.forEach(r => console.log('  · ' + r));
          }
        " 2>/dev/null || cat /tmp/mdvp-report.json
        echo "::endgroup::"

        # Write a first-class GitHub Actions job summary when available.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          MDVP_TARGET_URL="${{ inputs.url }}" node - /tmp/mdvp-report.json <<'NODE' >> "$GITHUB_STEP_SUMMARY"
        const { readFileSync } = require('fs');
        const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
        const components = report.components ?? {};
        const violations = report.violations ?? [];
        const recommendations = report.recommendations ?? [];
        const status = violations.length ? 'FAIL' : 'PASS';
        const rows = [
          ['css_health', components.css_health?.score],
          ['visual_quality', components.visual_quality?.score],
          ['structure', components.structure?.score],
          ['originality', components.originality?.score],
        ];

        console.log('## MDVP Design Quality');
        console.log('');
        console.log(`Target: \`${process.env.MDVP_TARGET_URL}\``);
        console.log(`Result: **${status}**`);
        console.log(`Overall: **${report.overall_score ?? ''}/100 (${report.grade ?? ''})**`);
        console.log('');
        console.log('| Component | Score |');
        console.log('|---|---:|');
        for (const [name, score] of rows) {
          console.log(`| ${name} | ${score ?? ''} |`);
        }
        console.log('');
        if (violations.length) {
          console.log('### Threshold Violations');
          for (const violation of violations) console.log(`- ${violation.msg ?? String(violation)}`);
          console.log('');
        }
        if (recommendations.length) {
          console.log('### Recommendations');
          for (const recommendation of recommendations.slice(0, 5)) console.log(`- ${recommendation}`);
          console.log('');
        }
        console.log('<sub>Generated by `@mdvp/cli`.</sub>');
        NODE
        fi

        # Print stderr (Puppeteer progress)
        if [ -s /tmp/mdvp-stderr.txt ]; then
          echo "::group::MDVP Crawler Output"
          cat /tmp/mdvp-stderr.txt
          echo "::endgroup::"
        fi

        VIOLATIONS=$(echo $RESULT | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); process.stdout.write(String((d.violations??[]).length))" 2>/dev/null || echo "0")
        echo "violation_count=$VIOLATIONS" >> $GITHUB_OUTPUT

    - name: Comment on pull request
      if: ${{ inputs.comment_on_pr == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      continue-on-error: true
      env:
        MDVP_REPORT_JSON: ${{ steps.audit.outputs.report_json }}
        MDVP_TARGET_URL: ${{ inputs.url }}
      with:
        script: |
          const report = JSON.parse(process.env.MDVP_REPORT_JSON || '{}');
          const components = report.components || {};
          const violations = report.violations || [];
          const recommendations = report.recommendations || [];
          const status = violations.length ? 'FAIL' : 'PASS';
          const marker = '<!-- mdvp-cli-action-report -->';
          const componentRows = [
            ['css_health', components.css_health?.score],
            ['visual_quality', components.visual_quality?.score],
            ['structure', components.structure?.score],
            ['originality', components.originality?.score],
          ].map(([name, score]) => `| ${name} | ${score ?? ''} |`).join('\n');
          const violationText = violations.length
            ? `\n\n### Threshold Violations\n${violations.map((v) => `- ${v.msg ?? String(v)}`).join('\n')}`
            : '';
          const recommendationText = recommendations.length
            ? `\n\n### Recommendations\n${recommendations.slice(0, 5).map((r) => `- ${r}`).join('\n')}`
            : '';
          const body = [
            marker,
            '## MDVP Design Quality',
            '',
            `Target: \`${process.env.MDVP_TARGET_URL}\``,
            `Result: **${status}**`,
            `Overall: **${report.overall_score ?? ''}/100 (${report.grade ?? ''})**`,
            '',
            '| Component | Score |',
            '|---|---:|',
            componentRows,
            violationText,
            recommendationText,
            '',
            '<sub>Generated by `@mdvp/cli`.</sub>',
          ].filter(Boolean).join('\n');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
          const existing = comments.data.find((comment) =>
            comment.user?.type === 'Bot' && comment.body?.includes(marker)
          );
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce thresholds
      if: ${{ inputs.fail_on_violation == 'true' && steps.audit.outputs.violation_count != '0' }}
      shell: bash
      run: |
        echo "::error::MDVP found ${{ steps.audit.outputs.violation_count }} design quality violation(s). See report above."
        exit 1
