name: Feature request
description: New metric, command, output format, or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: "What workflow does this improve? What can't you do today?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scoring / metrics
        - CLI output / UX
        - GitHub Action
        - MCP server
        - .mdvprc config
        - Documentation
        - Other
