name: Release

# Trigger: push a semver tag — e.g. `git tag v1.32.0 && git push --tags`
# Nightly prereleases use semver prerelease tags, e.g. `v1.33.1-nightly.20260611.1`.
# The tag version MUST match package.json version (enforced below).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create GitHub Release
  id-token: write   # npm Trusted Publisher + provenance (OIDC, no NPM_TOKEN needed)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Full CI matrix ─────────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ── 2. Verify tag matches package.json ────────────────────────────────────
  version-check:
    name: Tag ↔ package.json version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "Tag: $TAG | package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag v$TAG does not match package.json version $PKG"
            echo "Run: npm version $TAG --no-git-tag-version, commit, then retag."
            exit 1
          fi
          node -e "const semver='${TAG}'; if (!/^\\d+\\.\\d+\\.\\d+(-[0-9A-Za-z.-]+)?$/.test(semver)) { console.error('ERROR: tag is not a supported semver release tag'); process.exit(1) }"

  # ── 3. Publish to npm (Trusted Publisher — no NPM_TOKEN secret required) ───
  # One-time setup on npmjs.com → @mdvp/cli → Settings → Publishing → Trusted Publishers:
  #   Org/user: Tixo-Digital  |  Repo: mdvp-cli  |  Workflow: release.yml
  publish:
    name: Publish to npm
    needs: [test, version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check npm version
        id: npm-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@mdvp/cli@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@mdvp/cli@$VERSION already exists on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upgrade npm (Trusted Publishing OIDC requires npm 11+; Node 22 ships npm 10)
        if: steps.npm-version.outputs.published != 'true'
        run: npm install -g npm@latest

      - name: Publish (OIDC Trusted Publisher)
        if: steps.npm-version.outputs.published != 'true'
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "Pre-release detected, using --tag=nightly so it does not replace latest"
            npm publish --provenance --access public --tag=nightly
          else
            npm publish --provenance --access public
          fi

  # ── 4. GitHub Release with auto-generated notes ───────────────────────────
  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so --generate-notes can diff tags

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pack release tarball asset
        id: pack
        run: |
          npm pack --json > npm-pack.json
          PACK_FILE=$(node -e "const pack = require('./npm-pack.json'); console.log(pack[0].filename)")
          sha256sum "$PACK_FILE" > "$PACK_FILE.sha256"
          echo "file=$PACK_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving it in place."
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Nightly $GITHUB_REF_NAME" \
              --prerelease \
              --generate-notes \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Release $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload release tarball asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.pack.outputs.file }}" \
            "${{ steps.pack.outputs.file }}.sha256" \
            --clobber
